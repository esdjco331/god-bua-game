<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>股市問神明｜擲筊籤詩</title>

  <meta name="description" content="股市問神明，輸入台股代號，擲筊問漲跌，查看今日行情、漲幅與成交量。" />
  <meta name="theme-color" content="#3b0000" />

  <!-- 加版本號，強制瀏覽器讀新版 CSS -->
  <link rel="stylesheet" href="style.css?v=500" />
</head>

<body>

  <canvas id="particles"></canvas>
  <canvas id="kline"></canvas>

  <div class="temple-gate">
    <div class="roof"></div>
    <div class="lantern l1">財</div>
    <div class="lantern l2">運</div>
  </div>

  <main class="app">

    <section class="hero">

      <div class="god-light" id="godLight"></div>

      <div class="god-symbol" id="godSymbol">
        神
      </div>

      <h1>股市問神明</h1>

      <p class="subtitle">
        擲筊問漲跌 · 籤詩看方向 · 台股神諭
      </p>

      <div class="stock-box">

        <input
          id="stockInput"
          type="text"
          inputmode="numeric"
          maxlength="12"
          autocomplete="off"
          placeholder="輸入股票代號，例如 2330"
        />

        <button id="clearBtn" type="button">
          清除
        </button>

      </div>

      <div class="bua-stage" id="stage">

        <div class="bua bua-left" id="leftBua">
          <span class="shine"></span>
        </div>

        <div class="bua bua-right" id="rightBua">
          <span class="shine"></span>
        </div>

      </div>

      <button class="throw-btn" id="throwBtn" type="button">
        開始擲筊
      </button>

      <div class="result-card">

        <div class="result" id="result">
          請誠心默念股票代號
        </div>

        <div class="meaning" id="meaning">
          神明將給你今日方向
        </div>

        <div class="market-info" id="marketInfo">
          輸入股號後，擲筊會同步查詢今日行情
        </div>

        <div class="poem" id="poem"></div>

      </div>

      <p class="tip">
        聖杯＝會漲　笑杯＝觀望　哭杯＝會跌｜純娛樂，非投資建議
      </p>

    </section>

  </main>

  <noscript>
    請開啟 JavaScript 才能使用股市問神明。
  </noscript>

  <!-- 加版本號，強制瀏覽器讀新版 JS -->
  <script src="script.js?v=500"></script>

</body>
</html>
